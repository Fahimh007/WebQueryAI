<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 20px;
      }

      h1 {
        color: #333;
      }

      table {
        border-collapse: collapse;
        width: 80%;
        background: white;
      }

      th,
      td {
        border: 1px solid black;
        padding: 8px 12px;
        text-align: center;
      }

      th {
        background-color: #ddd;
      }
      .adult {
        background-color: rgb(94, 190, 94);
      }
      .minor {
        background-color: rgba(221, 39, 39, 0.823);
      }
      header p {
        color: var(--muted);
        font-size: 15px;
        max-width: 500px;
     }
      .url-row {
        margin-bottom: 20px;
      }
      .url-input {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .btn {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn:hover {
        background-color: #0056b3;
      }
      .answer, .error {
        margin-top: 20px;
        padding: 15px;
        border-radius: 4px;
      }
      .answer {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }
      .error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }
    </style>
</head>
<body>
    <header>
      <div class="logo">
        <div class="logo-icon">🧠</div>
        <div class="logo-text">WebRAG</div>
      </div>
      <p>Submit any website URL and get AI-powered insights. Ask questions, extract information, and understand any site instantly.</p>
    </header>
    {% block start %}{% endblock %}
</body>
</html>
