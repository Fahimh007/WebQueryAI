<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRAG — Website RAG Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg: #f5f7fb;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: #0f62fe;
        --accent-700: #0b4fd6;
        --glass: rgba(255,255,255,0.6);
      }

      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        background:linear-gradient(180deg,var(--bg),#eef2f7);
        color:#0f172a;
        -webkit-font-smoothing:antialiased;
      }

      .site-header{max-width:1100px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}
      .brand{display:flex;align-items:center;gap:12px}
      .brand .logo{font-size:28px}
      .brand .name{font-weight:700;font-size:18px}
      .nav{display:flex;gap:12px;align-items:center}
      .nav a{color:var(--muted);text-decoration:none;font-size:14px}

      .container{max-width:1100px;margin:28px auto;padding:0 24px}

      footer{max-width:1100px;margin:28px auto;padding:18px 24px;color:var(--muted);font-size:13px}

      @media(max-width:600px){.site-header{padding:14px}.container{padding:0 16px}}
    </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="logo">🧠</div>
      <div class="name">WebRAG</div>
    </div>
    <nav class="nav" aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">Docs</a>
      <a href="#">About</a>
    </nav>
  </header>

  <main class="container">
    {% block start %}{% endblock %}
  </main>

  <footer>
    Built with care — WebRAG · Local development server
  </footer>
</body>
</html>
